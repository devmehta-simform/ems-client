<div class="card w-64 mt-3 mb-3 transition-all bg-white shadow-md rounded-lg overflow-hidden flex flex-col h-full">
  <div class="bg-gray-200 h-40 flex items-center justify-center">
    <img src="{{ event.coverImage | cloudinaryImage: 'event' }}" class="h-40 w-full object-cover" alt="" appImgFallback />
  </div>
  <div class="p-4 relative flex-grow flex flex-col">
    <div class="absolute top-[-150px] left-3">
      <button (click)="handleLike()" class="w-8 h-8 rounded-full bg-white bg-opacity-75 flex items-center justify-center shadow-xl">
        <div class="flex justify-center items-center w-full h-full">
          <img [class.hidden]="heartStatus !== 'unfilled'" class="object-cover w-5 h-5" src="icons/unfilled-heart.svg" alt="heart" />
          <img [class.hidden]="heartStatus !== 'animate'" class="object-cover w-12 h-12" src="icons/animate-heart.gif" alt="heart" #animatedHeart />
          <img [class.hidden]="heartStatus !== 'filled'" class="object-cover w-5 h-5" src="icons/filled-heart.svg" alt="heart" />
        </div>
      </button>
    </div>
    <a [routerLink]="'/guest/event-details/' + event.id" class="flex-grow flex flex-col">
      <div class="flex flex-col justify-between flex-1">
        <div class="cursor-pointer flex justify-between items-center mb-2">
          <h2 class="text-base font-medium line-clamp-2">{{ event.name }}</h2>
          <p class="text-sm text-gray-600 whitespace-nowrap ml-1">From {{ event.ticketPrice | currency }}</p>
        </div>
        <div>
          <div class="flex items-center text-sm text-gray-600 mb-1">
            <img height="16" width="16" class="mr-2 flex-shrink-0" src="icons/calendar.svg" alt="calendar" />
            <span class="truncate">{{ event.dateOfEvent | date }}</span>
          </div>
          <div class="flex items-center text-sm text-gray-600">
            <img height="16" width="16" class="mr-2 flex-shrink-0" src="icons/location.svg" alt="location" />
            <span class="truncate">{{ event.address }}</span>
          </div>
        </div>
      </div>
    </a>
  </div>
</div>
